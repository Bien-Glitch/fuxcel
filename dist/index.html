<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Fuxcel</title>
	
	<link rel="stylesheet" href="css/fuxcel.css">
	<script defer src="js/fuxcel.js"></script>
</head>

<style>
	#div:after {
		display: flex;
		content: "Hello";
	}
</style>

<body>
	<form action="" id="test-form">
		
		<div class="form-group">
			<div class="form-group-wrapper">
				<div class="input-group">
					<div class="input-group-wrapper">
						<label class="fx-floating">name</label>
						<input type="text" placeholder="name" class="form-field">
						<div class="validation-icons">
							hello
						</div>
					</div>
					<div></div>
				</div>
				<div></div>
			</div>
		</div>
		
		<div class="form-group">
			<div class="form-group-wrapper">
				<div class="input-group">
					<div class="input-group-wrapper">
						<label class="fx-floating">email</label>
						<input type="email" placeholder="email" class="form-field">
						<div class="validation-icons">
						
						</div>
					</div>
					<div></div>
				</div>
				<div></div>
			</div>
		</div>
	</form>
	
	<form action="" id="test-form-1">
		<input type="text" class="test-input" data-fuxcel-test-one="test">
		<div class="test-div"></div>
	</form>
	
	<a href="" class="drop" style="display:flex;position:relative;">
		Dropdown Link
		<div style="position: absolute;top: 100%;display: none">Menu</div>
	</a>
</body>
</html>
