<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Fuxcel</title>
	
	<link rel="stylesheet" href="css/fuxcel.css">
	<script defer src="js/fuxcel.js"></script>
</head>

<body>
	<main>
		<form action="" id="test-form">
			<div class="form-group">
				<label for="title">title</label>
				<input type="text" minlength="" id="title" placeholder="title" class="form-field">
			</div>
			
			<div class="form-group">
				<label for="name">name</label>
				<input type="text" id="name" placeholder="name" class="form-field">
			</div>
			
			<div class="form-group">
				<input type="email" id="email" placeholder="email" class="form-field" style="padding: 1rem">
				<label for="email">email</label>
			</div>
		</form>
		
		<form action="" id="test-form-1">
			<div class="form-group">
				<input type="password" id="password" name="password" class="form-field">
				<label>password</label>
			</div>
			
			<div class="form-group">
				<input type="password" id="password_confirmation" name="password_confirmation" class="form-field">
				<label>password</label>
			</div>
		</form>
		
		<a href="" class="drop" style="display:flex;position:relative;">
			Dropdown Link
			<div style="position: absolute;top: 100%;display: none">Menu</div>
		</a>
	</main>
</body>
</html>
